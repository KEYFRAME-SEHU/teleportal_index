<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Virtual Worlds Museum JSON Tree</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: rgba(255, 255, 255, 0.05);
      --panel-strong: rgba(255, 255, 255, 0.08);
      --line: rgba(255, 255, 255, 0.12);
      --text: #eef2ff;
      --muted: #c7ced9;
      --accent: #7dd3fc;
      --accent-strong: #a7f3d0;
      --value: #a7f3d0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(125, 211, 252, 0.14), transparent 28%),
        linear-gradient(180deg, #111827 0%, #030712 100%);
    }

    .page {
      width: min(1200px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 40px;
    }

    .hero,
    .tree-panel {
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--panel);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(12px);
    }

    .hero {
      padding: 28px;
      margin-bottom: 20px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      padding: 7px 12px;
      border: 1px solid rgba(125, 211, 252, 0.28);
      border-radius: 999px;
      color: var(--accent);
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 14px 0 10px;
      font-size: clamp(2rem, 6vw, 3.6rem);
      line-height: 0.95;
      letter-spacing: -0.05em;
    }

    .hero p {
      margin: 0;
      max-width: 68ch;
      color: var(--muted);
      line-height: 1.7;
    }

    .tree-panel {
      padding: 18px 20px;
      overflow: auto;
    }

    #tree {
      min-width: max-content;
    }

    .status {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .tree-root,
    .tree-root ul {
      list-style: none;
      margin: 0;
      padding-left: 18px;
    }

    .tree-root {
      padding-left: 0;
    }

    .tree-root ul {
      margin-top: 8px;
      border-left: 1px solid rgba(255, 255, 255, 0.08);
    }

    .tree-node {
      margin: 6px 0;
    }

    .branch-body {
      padding: 6px 0 2px 12px;
    }

    .about-section {
      max-width: min(100vw - 80px, 42rem);
      min-width: 0;
      padding-left: 0;
      border-left: none;
    }

    .about-section .tree-node {
      min-width: 0;
    }

    .about-snapshot {
      padding: 0 10px;
    }

    .snapshot-preview {
      display: inline-block;
      margin: 8px 0 10px;
      width: min(200px, 100%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.04);
    }

    .snapshot-image {
      display: block;
      width: 100%;
      height: auto;
    }

    details {
      border-radius: 14px;
    }

    summary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 12px;
      background: var(--panel-strong);
      cursor: pointer;
      user-select: none;
      transition: background 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.02);
    }

    summary:hover,
    summary:focus-visible {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(167, 243, 208, 0.18);
      outline: none;
    }

    .key {
      color: var(--accent-strong);
    }

    .meta-key {
      color: var(--muted);
    }

    .meta {
      color: var(--muted);
    }

    .size-indicator {
      display: inline-flex;
      align-items: flex-end;
      gap: 3px;
      margin-left: 2px;
      color: var(--value);
      white-space: nowrap;
    }

    .size-person {
      position: relative;
      display: inline-block;
      width: 7px;
      height: 11px;
      flex: 0 0 auto;
    }

    .size-person::before,
    .size-person::after {
      content: "";
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      background: currentColor;
      opacity: 0.95;
    }

    .size-person::before {
      top: 0;
      width: 5px;
      height: 5px;
      border-radius: 999px;
    }

    .size-person::after {
      top: 4px;
      width: 7px;
      height: 7px;
      border-radius: 3px 3px 2px 2px;
    }

    .summary-link-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-left: 2px;
      padding: 4px 10px;
      border: 1px solid rgba(125, 211, 252, 0.26);
      border-radius: 999px;
      color: var(--accent);
      text-decoration: none;
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: border-color 160ms ease, color 160ms ease, background 160ms ease;
    }

    .summary-link-button:hover,
    .summary-link-button:focus-visible {
      border-color: rgba(167, 243, 208, 0.38);
      color: var(--accent-strong);
      background: rgba(255, 255, 255, 0.05);
      outline: none;
    }

    .summary-link-button.world-link {
      color: var(--accent-strong);
      border-color: rgba(167, 243, 208, 0.26);
    }

    .summary-link-button.world-link:hover,
    .summary-link-button.world-link:focus-visible {
      color: var(--text);
      border-color: rgba(167, 243, 208, 0.42);
      background: rgba(167, 243, 208, 0.08);
    }

    .value-line {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 12px;
      min-width: 0;
    }

    .value-string {
      color: var(--value);
      word-break: break-word;
      overflow-wrap: anywhere;
    }

    .value-number {
      color: var(--value);
    }

    .value-boolean {
      color: var(--value);
    }

    .value-null {
      color: var(--value);
    }

    .value-empty {
      color: var(--muted);
      font-style: italic;
    }

    .value-link {
      color: var(--accent);
      text-decoration-color: rgba(125, 211, 252, 0.45);
      text-underline-offset: 0.15em;
      word-break: break-word;
      overflow-wrap: anywhere;
    }

    .value-link:hover,
    .value-link:focus-visible {
      color: var(--accent-strong);
      outline: none;
    }

    .child-section {
      margin-top: 6px;
      min-width: 0;
    }

    .child-heading {
      margin: 8px 0 0 10px;
      color: var(--muted);
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 0.92rem;
    }

    @media (max-width: 640px) {
      .page {
        width: min(100% - 20px, 1200px);
        padding-top: 18px;
      }

      .hero,
      .tree-panel {
        border-radius: 20px;
      }

      .hero {
        padding: 22px;
      }

      .tree-panel {
        padding: 14px;
      }

      .about-section {
        max-width: calc(100vw - 44px);
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <section class="hero">
      <div class="eyebrow">Worlds Catalog</div>
      <h1>Virtual Worlds Museum</h1>
      <p>Browse the Virtual World Museum <b style="color:#a7f3d0">Worlds Catalog</b> connected by our numerous <b style="color:#7dd3fc">Museum Locations</b>!</p>
    </section>

    <section class="tree-panel">
      <div id="status" class="status">Loading <code>vwm.json</code>...</div>
      <div id="tree" aria-live="polite"></div>
    </section>
  </div>

  <script type="module" src="./view.js"></script>
</body>
</html>
